name: Refresh market data

# Pulls the latest real 1m bars for SPY/QQQ/ES/NQ and commits them to data/,
# where the Replay Trainer app auto-loads them on launch.
on:
  schedule:
    - cron: "17 22 * * 2-6"   # 22:17 UTC Tue-Sat = after US close Mon-Fri (ET)
  workflow_dispatch: {}        # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch latest 1m data
        working-directory: data
        run: python fetch_replay_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No new data (weekend/holiday?)" && exit 0
          git commit -m "Refresh market data"
          git push
